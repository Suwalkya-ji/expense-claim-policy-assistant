# Render Blueprint: https://render.com/docs/blueprint-spec
# New → Blueprint → pick this repo. Fill in the secret values when prompted.
services:
  - type: web
    name: expense-claim-review
    runtime: node
    plan: free
    buildCommand: npm run ci:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI # MongoDB Atlas connection string
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_RPM
        value: "5"
      - key: APP_USERNAME # optional shared login for reviewers
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: LOG_LEVEL
        value: info
